name: Node.js Runtime acceptance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  acceptance:
    env:
      npm_config_registry: https://registry.561.group/
      COREPACK_NPM_REGISTRY: https://registry.561.group/
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install suppliers with the source-pinned manager and shared store
        run: |
          set -euo pipefail
          shared_store="${PNPM_STORE_DIR:-${PNPM_HOME:-${XDG_DATA_HOME:-$HOME/.local/share}/pnpm}/store}"
          mkdir -p -- "$shared_store"
          store_mode="$(stat -c %a -- "$shared_store")"
          umask "$(printf '%03o' "$((0777 & ~0$store_mode))")"
          corepack pnpm@11.19.0 install --frozen-lockfile --ignore-scripts \
            --config.registry=https://registry.561.group/ --store-dir="$shared_store" \
            --config.enable-global-virtual-store=true --config.package-import-method=hardlink
      - run: npm run check
      - run: npm test
      - name: Run the installed runtime example
        run: |
          consumer=$(mktemp -d)
          trap 'rm -rf "$consumer"' EXIT
          archive=$(npm pack --silent --ignore-scripts --pack-destination "$consumer")
          cd "$consumer"
          npm install --ignore-scripts --no-audit --no-fund --registry=https://registry.561.group/ \
            --@red-cup-engineering:registry=https://registry.561.group/ \
            --@lenticule-science:registry=https://registry.561.group/ "./$archive"
          package=node_modules/@red-cup-engineering/javascript-node-engineering-services-section
          cp "$package/examples/quickstart.test.mjs" quickstart.test.mjs
          node --test ./quickstart.test.mjs
      - name: Receive the installed argument parser and its original notices
        run: |
          service=services/javascript-argv-parsing-services-section/services/parse-javascript-argv-service
          consumer=$(mktemp -d)
          trap 'rm -rf "$consumer"' EXIT
          archive=$(cd "$service" && npm pack --silent --ignore-scripts --pack-destination "$consumer")
          cp .npmrc "$consumer/.npmrc"
          cd "$consumer"
          echo '{"private":true,"type":"module"}' > package.json
          npm install --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org "./$archive"
          package=node_modules/@red-cup-engineering/parse-javascript-argv-service
          cmp "$GITHUB_WORKSPACE/$service/LICENSE" "$package/LICENSE"
          cmp "$GITHUB_WORKSPACE/$service/README.md" "$package/README.md"
          (cd "$package" && npm test)
